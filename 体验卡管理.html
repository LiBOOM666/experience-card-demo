  <style>
    :root{--main:#29c7b1;--deep:#18a996;--danger:#f05b5b;--text:#2f3b52;--sub:#758195;--line:#e7edf3;--bg:#f1f4f7;--blue:#4d8af0}*{box-sizing:border-box}body{margin:0;min-width:1240px;background:var(--bg);color:var(--text);font:14px "PingFang SC","Microsoft YaHei",sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer}.topbar{height:68px;background:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 24px;border-bottom:1px solid var(--line)}.topbar h1{margin:0;font-size:18px}.operator{color:var(--sub);font-size:13px}.main{padding:16px}.toolbar{height:62px;background:#fff;padding:0 16px;display:flex;align-items:center;justify-content:space-between}.toolbar-actions{display:flex;gap:10px}.tab{height:62px;display:flex;align-items:center;color:var(--deep);font-weight:700;border-bottom:2px solid var(--main)}.btn{height:34px;border:1px solid var(--main);border-radius:17px;background:#fff;color:var(--deep);padding:0 18px}.btn.primary{background:var(--main);color:#fff}.btn:disabled,.btn.disabled{cursor:not-allowed;background:#f3f5f7;border-color:#e3e7eb;color:#a7b0bc}.panel{margin-top:14px;background:#fff;border:1px solid var(--line)}.filters{display:flex;align-items:center;gap:18px;padding:24px 16px 14px;min-height:90px;border-bottom:1px solid var(--line)}label{white-space:nowrap;color:#526075}.field{height:34px;min-width:144px;border:1px solid #dbe2ea;border-radius:17px;padding:0 13px;outline:none;color:var(--text);background:#fff}.search{width:300px}.field:focus,textarea:focus,.form-input:focus{border-color:var(--main);box-shadow:0 0 0 3px rgba(41,199,177,.12)}.reset{border:0;background:none;color:var(--sub);padding:7px}.table-wrap{overflow-x:auto}table{width:100%;border-collapse:collapse;min-width:1280px}th,td{height:50px;padding:0 16px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}th{background:#fbfcfe;font-weight:700}th:last-child,td:last-child{border-right:0}.type{color:#526075}.tag{display:inline-block;padding:2px 8px;line-height:18px;border-radius:4px;font-size:13px}.on{color:var(--deep);border:1px solid #a7e6dc;background:#effbf8}.off{color:#758195;border:1px solid #dbe2ea;background:#f5f7f9}.yes{color:#2476d0;border:1px solid #bdd7fb;background:#f1f7ff}.no{color:#758195;border:1px solid #dbe2ea;background:#f5f7f9}.actions{display:flex;gap:12px}.link{border:0;padding:0;background:transparent;color:var(--deep);font-size:13px;white-space:nowrap}.link.danger{color:var(--danger)}.link:disabled{color:#b9c2ce;cursor:not-allowed}.pagination{height:58px;padding:0 16px;display:flex;align-items:center;justify-content:flex-end;gap:12px;color:var(--sub);font-size:13px}.page{width:28px;height:28px;background:#fff;border:1px solid var(--main);color:var(--deep)}.overlay{position:fixed;inset:0;background:rgba(31,42,58,.36);display:none;align-items:center;justify-content:center;z-index:5}.overlay.show{display:flex}.modal{width:640px;max-height:88vh;display:flex;flex-direction:column;background:#fff;box-shadow:0 10px 30px rgba(47,59,82,.12)}.modal.wide{width:1060px}.modal.small{width:480px}.modal.full{width:calc(100vw - 48px);height:calc(100vh - 48px);max-height:none}.modal-head{height:54px;flex:none;padding:0 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;font-weight:700;font-size:16px}.x{border:0;background:none;color:#758195;font-size:23px;line-height:1}.modal-body{padding:18px 20px;overflow:auto}.modal.full .modal-body{padding:16px;background:#f5f6f7}.modal-foot{min-height:58px;padding:12px 20px;display:flex;align-items:center;justify-content:flex-end;gap:12px;border-top:1px solid var(--line)}.modal.full .modal-foot{min-height:72px;background:#fff}.record-panel{background:#fff;border:1px solid var(--line)}.record-filter{padding:18px 16px;display:flex;gap:14px;align-items:center;flex-wrap:wrap;border-bottom:1px solid var(--line)}.record-filter .field{min-width:180px}.record-filter-actions{display:flex;align-items:center;gap:10px;margin-left:auto}.record-table{min-width:100%}.form-row{margin-bottom:18px}.form-row>label{display:block;margin-bottom:8px;color:var(--text)}.required:before{content:"*";color:var(--danger);margin-right:4px}.form-input{width:100%;height:36px;border:1px solid #dbe2ea;border-radius:4px;padding:0 10px;outline:0}.radio-line{min-height:36px;display:flex;align-items:center;gap:22px}.radio-line label{color:var(--text)}input[type=radio],input[type=checkbox]{accent-color:var(--main);vertical-align:-1px;margin-right:6px}.textarea{width:100%;min-height:72px;border:1px solid #dbe2ea;border-radius:4px;padding:8px 10px;resize:vertical;outline:0}.hint{margin:6px 0 0;color:var(--sub);font-size:13px;line-height:1.7}.section-title{margin:2px 0 16px;font-weight:700}.qr-area{text-align:center;padding:6px 0 18px}.qr{width:190px;height:190px;margin:0 auto 13px;background:repeating-linear-gradient(45deg,#172238 0 6px,#fff 6px 10px);border:8px solid #fff;outline:1px solid var(--line);display:grid;place-items:center}.qr b{display:block;padding:8px;background:#fff;color:var(--deep)}.notice{padding:12px 14px;background:#f7f9fb;color:var(--sub);line-height:1.8;font-size:13px}.toast{position:fixed;z-index:10;top:84px;left:50%;transform:translateX(-50%);padding:10px 16px;background:rgba(31,42,58,.88);color:#fff;border-radius:4px;display:none}.toast.show{display:block}.setting-grid{display:grid;grid-template-columns:42% 58%;gap:10px;min-height:100%}.setting-card{background:#fff;border:1px solid #dedede}.setting-card h3{height:64px;margin:0;padding:0 28px;display:flex;align-items:center;border-bottom:1px solid #e7e7e7;font-size:16px}.setting-content{padding:26px 40px}.setting-row{display:grid;grid-template-columns:108px minmax(220px,1fr);align-items:start;gap:12px;margin-bottom:18px}.setting-row>label{text-align:right;padding-top:9px;font-weight:600;color:#596273}.setting-row .form-input{max-width:468px}.unit-input{position:relative;max-width:468px}.unit-input b{position:absolute;right:12px;top:9px;font-weight:400;color:#667083}.upload-box{width:200px;height:120px;background:#fafbfc;border:1px dashed #cfd8df;color:#9aa4b2;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px}.upload-box strong{font-size:24px;color:#c5cbd3}.store-option{display:flex;flex-wrap:wrap;gap:12px 28px;padding-top:8px}.store-option .full-line{width:100%}.info-tip{padding:13px 18px;border:1px solid #b6eb82;background:#f6ffed;color:#6d8e51;margin-bottom:18px}.course-filter{display:flex;align-items:center;gap:20px;margin:4px 0 22px}.course-search{width:440px;height:42px;border:1px solid #d9dee5;border-radius:22px;padding:0 16px;font-size:16px}.course-filter select{height:42px;width:220px;border:1px solid #d9dee5;border-radius:22px;padding:0 16px;color:var(--text);background:#fff}.course-table th,.course-table td{height:58px;font-size:15px}.course-table input[type=number]{width:144px;height:34px;border:1px solid #dbe2ea;padding:0 10px}.course-table tr.selected td{background:#edfcfa}.course-table th:first-child,.course-table td:first-child{width:62px;text-align:center}.course-table th:nth-child(2){width:34%}.course-table th:nth-child(3){width:34%}.course-status{color:var(--deep);border:1px solid var(--main);padding:3px 8px;border-radius:4px}.course-summary{margin-top:14px;color:var(--sub);font-size:13px}
    /* 嵌入侧边导航后：仅让宽表格横向滚动，页面和检索区不再整体溢出。 */
    body{min-width:0}.main,.panel{min-width:0}.filters{flex-wrap:wrap;gap:12px 18px}.table-wrap{width:100%}
  </style>

<body>
  <header class="topbar"><h1>体验卡管理</h1><span class="operator">运营管理</span></header>
  <main class="main"><section class="toolbar"><span class="tab">体验卡</span><div class="toolbar-actions"><button class="btn" onclick="openRecordList('issue')">发放记录</button><button class="btn" onclick="openRecordList('use')">使用记录</button><button class="btn primary" onclick="openForm()">添加体验卡</button></div></section>
    <section class="panel"><div class="filters"><label>名称 <input id="nameFilter" class="field search" placeholder="请输入名称" oninput="filterRows()" /></label><label>状态 <select id="statusFilter" class="field" onchange="filterRows()"><option value="">全部</option><option>上架</option><option>下架</option></select></label><label>线上可售 <select id="saleFilter" class="field" onchange="filterRows()"><option value="">全部</option><option>是</option><option>否</option></select></label><button class="btn" onclick="filterRows()">查询</button><button class="reset" onclick="resetFilters()">重置</button></div>
      <div class="table-wrap"><table><thead><tr><th>名称</th><th>类型</th><th>有效期</th><th>次数</th><th>标准价格</th><th>状态</th><th>线上可售</th><th>可用门店</th><th>操作</th></tr></thead><tbody id="cardRows"></tbody></table></div>
      <div class="pagination"><span id="total">共 4 条</span><span>10条/页</span><button class="page">1</button></div></section>
  </main><div id="overlay" class="overlay"><div id="modal" class="modal"></div></div><div id="toast" class="toast"></div>
  <script>
    let cards=[
      {id:1,name:'新生游泳体验卡',days:7,times:1,price:0,status:'上架',online:'是',stores:'全部门店'},
      {id:2,name:'少儿游泳体验卡',days:14,times:2,price:99,status:'上架',online:'是',stores:'滨江店、钱江店'},
      {id:3,name:'成人私教体验卡',days:30,times:3,price:199,status:'下架',online:'否',stores:'滨江店'},
      {id:4,name:'暑期体验卡',days:7,times:1,price:0,status:'删除',online:'否',stores:'全部门店'}
    ];let editingId=null;
    const $=s=>document.querySelector(s);const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
    function render(){const n=$('#nameFilter').value.trim(),st=$('#statusFilter').value,on=$('#saleFilter').value;const view=cards.filter(c=>c.status!=='删除'&&(!n||c.name.includes(n))&&(!st||c.status===st)&&(!on||c.online===on));$('#cardRows').innerHTML=view.map(c=>`<tr><td>${esc(c.name)}</td><td class="type">培训班体验次卡</td><td>${c.days} 天</td><td>${c.times} 次</td><td>${c.price} 元</td><td><span class="tag ${c.status==='上架'?'on':'off'}">${c.status}</span></td><td>${c.online==='是'?`<button class="tag yes link" onclick="openOnline(${c.id})">是 · 查看二维码</button>`:'<span class="tag no">否</span>'}</td><td>${esc(c.stores)}</td><td><div class="actions"><button class="link" onclick="openCourse(${c.id})">关联课程</button><button class="link" ${c.price!==0?'disabled title="标准售价不为0，无法批量发卡"':''} onclick="openIssue(${c.id})">发卡</button><button class="link" onclick="openForm(${c.id})">编辑</button><button class="link ${c.status==='上架'?'danger':''}" onclick="toggleStatus(${c.id})">${c.status==='上架'?'下架':'上架'}</button></div></td></tr>`).join('');$('#total').textContent=`共 ${view.length} 条`}
    function filterRows(){render()}function resetFilters(){$('#nameFilter').value='';$('#statusFilter').value='';$('#saleFilter').value='';render()}function closeModal(){$('#overlay').classList.remove('show')}function modal(title,body,foot='',klass=''){$('#modal').className='modal '+klass;$('#modal').innerHTML=`<div class="modal-head"><span>${title}</span><button class="x" onclick="closeModal()">×</button></div><div class="modal-body">${body}</div><div class="modal-foot">${foot}</div>`;$('#overlay').classList.add('show')}
    function showToast(t){const e=$('#toast');e.textContent=t;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),1800)}function toggleStatus(id){const c=cards.find(x=>x.id===id);c.status=c.status==='上架'?'下架':'上架';render();showToast(`已${c.status}`)}
    const miniProgramUrl=()=>new URL('培训班体验次卡购买.html',window.location.href).href;
    function openOnline(id){const c=cards.find(x=>x.id===id),url=miniProgramUrl();modal('线上可售',`<div class="qr-area"><button class="qr" title="点击预览培训班体验次卡购买页" onclick="openMiniProgram()"><b>培训班体验次卡<br>购买页</b></button><div>${esc(c.name)}</div><p class="hint">二维码与链接均指向「培训班体验次卡购买.html」。<br>点击二维码可预览购买页面。</p><p class="hint" style="word-break:break-all">${esc(url)}</p></div>`,`<button class="btn" onclick="copyLink()">复制链接</button><button class="btn primary" onclick="downloadQR('${esc(c.name)}')">下载二维码</button>`,'small')}
    function openMiniProgram(){window.open(miniProgramUrl(),'_blank')}function copyLink(){const url=miniProgramUrl();if(navigator.clipboard?.writeText){navigator.clipboard.writeText(url)}else{prompt('请复制培训班体验次卡购买页链接：',url)}showToast('培训班体验次卡购买页链接已复制')}function downloadQR(name){const url=miniProgramUrl();const svg=`<svg xmlns="http://www.w3.org/2000/svg" width="420" height="460" viewBox="0 0 420 460"><rect width="420" height="460" fill="white"/><rect x="34" y="34" width="352" height="352" fill="#172238"/><rect x="52" y="52" width="74" height="74" fill="white"/><rect x="64" y="64" width="50" height="50" fill="#172238"/><rect x="294" y="52" width="74" height="74" fill="white"/><rect x="306" y="64" width="50" height="50" fill="#172238"/><rect x="52" y="294" width="74" height="74" fill="white"/><rect x="64" y="306" width="50" height="50" fill="#172238"/><text x="210" y="415" font-size="18" text-anchor="middle" fill="#172238">培训班体验次卡购买</text><text x="210" y="440" font-size="12" text-anchor="middle" fill="#758195">${url.replace(/&/g,'&amp;')}</text></svg>`;const a=document.createElement('a');a.href='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg);a.download=name+'-培训班体验次卡购买二维码.svg';a.click();showToast('培训班体验次卡购买二维码已开始下载')}
    const issueRecords=[['钱江游泳馆','陈梓涵  138****1208','少儿游泳体验课','前台发卡','张佳','2026-09-07 10:24'],['滨江游泳馆','李沐阳  139****3812','暑期游泳体验课','在线购买','系统','2026-09-07 09:42'],['钱江游泳馆','王子轩  136****9980','少儿游泳体验课','前台发卡','王琳','2026-09-06 18:36'],['西溪游泳馆','刘诗涵  137****2654','自由泳体验课','在线购买','系统','2026-09-06 14:18']];
    const useRecords=[['钱江游泳馆','陈梓涵  138****1208','少儿游泳体验课','少儿游泳体验课','王教练','2026-09-07 19:45'],['滨江游泳馆','李沐阳  139****3812','暑期游泳体验课','暑期游泳基础课','李教练','2026-09-07 18:15'],['钱江游泳馆','王子轩  136****9980','少儿游泳体验课','少儿蛙泳体验课','赵教练','2026-09-06 19:30'],['西溪游泳馆','刘诗涵  137****2654','自由泳体验课','自由泳进阶体验课','陈教练','2026-09-06 17:45']];
    function openRecordList(type){const isIssue=type==='issue',title=isIssue?'体验权益发放记录':'体验权益使用记录',headers=isIssue?['门店','用户','体验卡','领取方式','操作人','操作时间','操作']:['门店','用户','体验卡','课程','上课教练','签课时间'],rows=isIssue?issueRecords:useRecords,filters=isIssue?'<label>门店 <input class="field" placeholder="请输入门店"></label><label>用户 <input class="field" placeholder="请输入姓名或手机号"></label><label>体验卡 <input class="field" placeholder="请输入或选择体验卡"></label><label>领取方式 <select class="field"><option>全部</option><option>前台发卡</option><option>在线购买</option></select></label><label>操作人 <input class="field" placeholder="请输入操作人"></label><label>操作时间 <input type="date" class="field"></label>':'<label>门店 <input class="field" placeholder="请输入门店"></label><label>用户 <input class="field" placeholder="请输入姓名或手机号"></label><label>体验卡 <input class="field" placeholder="请输入或选择体验卡"></label><label>课程 <input class="field" placeholder="请输入或选择课程"></label><label>上课教练 <input class="field" placeholder="请输入上课教练"></label><label>签课时间 <input type="date" class="field"></label>';$('.main').innerHTML=`<section class="toolbar"><span class="tab">${title}</span><div class="toolbar-actions"><button class="btn" onclick="showCardPage()">返回体验卡管理</button></div></section><section class="panel"><div class="record-filter">${filters}<button class="btn primary">查询</button><button class="reset">重置</button><span class="record-filter-actions"><button class="btn" onclick="exportRecords('${type}')">导出</button></span></div><div class="table-wrap"><table class="record-table"><thead><tr>${headers.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows.map(row=>`<tr>${row.map(v=>`<td>${v}</td>`).join('')}${isIssue?'<td><button class="link" onclick="openRecordList(\'use\')">使用记录</button></td>':''}</tr>`).join('')}</tbody></table></div><div class="pagination"><span>共 ${rows.length} 条</span><span>10 条/页</span><button class="page">1</button></div></section>`}
    function exportRecords(type){const isIssue=type==='issue',title=isIssue?'体验权益发放记录':'体验权益使用记录',headers=isIssue?['门店','用户','体验卡','领取方式','操作人','操作时间']:['门店','用户','体验卡','课程','上课教练','签课时间'],rows=isIssue?issueRecords:useRecords,csv='\ufeff'+[headers,...rows].map(row=>row.map(value=>`"${String(value).replace(/"/g,'""')}"`).join(',')).join('\r\n'),blob=new Blob([csv],{type:'text/csv;charset=utf-8'}),url=URL.createObjectURL(blob),link=document.createElement('a');link.href=url;link.download=title+'.csv';link.click();URL.revokeObjectURL(url);showToast(title+'已导出')}
    function showCardPage(){window.location.reload()}
    function openCourse(id){const c=cards.find(x=>x.id===id);modal('关联课程',`<div class="course-filter"><input class="course-search" placeholder="⌕  输入课程名称进行搜索" oninput="filterCourses(this.value)"><button class="btn primary" onclick="filterCourses(document.querySelector('.course-search').value)">搜索</button><label>状态 <select onchange="filterCourses('',this.value)"><option>上架中</option><option>全部</option></select></label></div><table class="course-table"><thead><tr><th><input type="checkbox" checked onchange="selectAllCourses(this.checked)"></th><th>课程名称</th><th>课程消耗</th><th>状态</th></tr></thead><tbody id="courseRows"><tr class="selected"><td><input type="checkbox" checked onchange="toggleCourse(this)"></td><td>室外课</td><td><input type="number" value="1" min="1"> 次/节</td><td><span class="course-status">上架中</span></td></tr><tr class="selected"><td><input type="checkbox" checked onchange="toggleCourse(this)"></td><td>暑期游泳课</td><td><input type="number" value="1" min="1"> 次/节</td><td><span class="course-status">上架中</span></td></tr><tr class="selected"><td><input type="checkbox" checked onchange="toggleCourse(this)"></td><td>搜索会员培训课</td><td><input type="number" value="1" min="1"> 次/节</td><td><span class="course-status">上架中</span></td></tr><tr><td><input type="checkbox" onchange="toggleCourse(this)"></td><td>篮球培训班24课时</td><td><input type="number" placeholder="课程消耗" min="1" disabled> 次/节</td><td><span class="course-status">上架中</span></td></tr><tr><td><input type="checkbox" onchange="toggleCourse(this)"></td><td>自由泳进阶班</td><td><input type="number" placeholder="课程消耗" min="1" disabled> 次/节</td><td><span class="course-status">上架中</span></td></tr></tbody></table><p class="course-summary">正在为「${esc(c.name)}」配置关联课程和每节课程消耗次数。</p>`,`<button class="btn" onclick="closeModal()">取消</button><button class="btn primary" onclick="saveCourses()">保存</button>`,'wide')}
    function toggleCourse(input){const row=input.closest('tr'),num=row.querySelector('input[type=number]');row.classList.toggle('selected',input.checked);num.disabled=!input.checked;if(input.checked&&!num.value)num.value=1}function selectAllCourses(checked){document.querySelectorAll('#courseRows input[type=checkbox]').forEach(x=>{x.checked=checked;toggleCourse(x)})}function filterCourses(key,status){document.querySelectorAll('#courseRows tr').forEach(row=>{const name=row.cells[1].textContent;row.style.display=!key||name.includes(key)?'':'none'})}function saveCourses(){const selected=[...document.querySelectorAll('#courseRows input[type=checkbox]:checked')];if(!selected.length){showToast('请至少选择一门课程');return}closeModal();showToast('关联课程已保存')}
    function openIssue(id){const c=cards.find(x=>x.id===id);if(c.price!==0)return;modal('批量发卡',`<p class="section-title">${esc(c.name)}</p><div class="form-row"><label class="required">手机号</label><textarea id="phones" class="textarea" placeholder="请输入需要发放体验权益的账号"></textarea><div class="notice">此操作用于为多个用户，同时批量发放相同的体验权限。<br>输入需要发放体验权益的账号，多个账号时用逗号进行分割。<br>如：13312341234,13312341235</div></div>`,`<button class="btn" onclick="closeModal()">取消</button><button class="btn primary" onclick="issueCards()">确认发卡</button>`,'small')}
    function issueCards(){const v=$('#phones').value.trim();if(!v){showToast('请填写手机号');return}const a=v.split(/[,，\s]+/).filter(Boolean);if(a.some(x=>!/^1\d{10}$/.test(x))){showToast('请输入正确的手机号，并用逗号分隔');return}closeModal();showToast(`已为 ${a.length} 个账号创建体验权益`)}
    function openForm(id){editingId=id||null;const c=id?cards.find(x=>x.id===id):{name:'',days:1,times:1,price:'',stores:'全部门店',online:'是',onlineBooking:'是',limit:1,sort:1};modal(id?'修改体验卡':'新增体验卡',`<div class="setting-grid"><section class="setting-card"><h3>基本信息</h3><div class="setting-content"><div class="setting-row"><label class="required">体验卡名称</label><input id="fName" class="form-input" value="${esc(c.name)}" placeholder="输入体验卡名称"></div><div class="setting-row"><label class="required">卡种类型</label><div class="radio-line"><label><input type="radio" checked>培训班体验次卡</label></div></div><div class="setting-row"><label class="required">卡内次数</label><div class="unit-input"><input id="fTimes" type="number" min="1" class="form-input" value="${c.times}" placeholder="默认为 1"><b>次</b></div></div><div class="setting-row"><label>有效期</label><div class="unit-input"><input id="fDays" type="number" min="1" class="form-input" value="${c.days}" placeholder="开卡后的有效天数"><b>天</b></div></div><div class="setting-row"><label class="required">标准售价</label><div class="unit-input"><input id="fPrice" type="number" min="0" class="form-input" value="${c.price}" placeholder="标准售价"><b>元</b></div></div><div class="setting-row"><label>体验卡图片</label><div class="upload-box"><strong>☁</strong><span>点击添加图片</span><small>支持 png/jpg，建议 750×386</small></div></div><div class="setting-row"><label>使用须知</label><textarea class="textarea" placeholder="请输入小程序卡介绍">到店前请提前预约课程。</textarea></div></div></section><section class="setting-card"><h3>更多设置</h3><div class="setting-content"><div class="info-tip">● 分店不可修改体验卡的“可售门店”和“可用门店”，可以通过总店设置。</div><div class="setting-row"><label>可售门店</label><div class="store-option"><label class="full-line"><input type="radio" name="sellStore">所有门店</label><label class="full-line"><input type="radio" name="sellStore" checked>选择门店</label><label><input type="checkbox">滨江店</label><label><input type="checkbox" checked>钱江店</label><label><input type="checkbox">西溪店</label></div></div><div class="setting-row"><label>可用门店</label><div class="store-option"><label class="full-line"><input type="radio" name="useStore" checked>仅销售门店</label><label class="full-line"><input type="radio" name="useStore">所有门店</label><label class="full-line"><input type="radio" name="useStore">指定门店</label></div></div><div class="setting-row"><label class="required">在线购卡</label><div class="radio-line"><label><input type="radio" name="online" value="是" ${c.online==='是'?'checked':''}>是</label><label><input type="radio" name="online" value="否" ${c.online==='否'?'checked':''}>否</label></div></div><div class="setting-row"><label class="required">可购次数</label><div class="unit-input"><input id="fLimit" type="number" min="1" class="form-input" value="${c.limit||1}" placeholder="默认为 1"><b>次</b></div></div><div class="setting-row"><label class="required">在线约课</label><div class="radio-line"><label><input type="radio" name="onlineBooking" value="是" ${c.onlineBooking!=='否'?'checked':''}>是</label><label><input type="radio" name="onlineBooking" value="否" ${c.onlineBooking==='否'?'checked':''}>否</label></div></div><div class="setting-row"><label>排序编号</label><input id="fSort" type="number" min="1" class="form-input" value="${c.sort||1}" placeholder="默认为 1"></div></div></section></div>`,`<button class="btn" onclick="closeModal()">取消</button><button class="btn primary" onclick="saveForm()">保存</button>`,'full')}
    function saveForm(){const name=$('#fName').value.trim(),times=Number($('#fTimes').value||1),days=Number($('#fDays').value),price=$('#fPrice').value,limit=Number($('#fLimit').value||1),sort=Number($('#fSort').value||1),online=document.querySelector('input[name=online]:checked'),onlineBooking=document.querySelector('input[name=onlineBooking]:checked');if(!name||!days||price===''||times<1||limit<1||sort<1||!online||!onlineBooking){showToast('请完整填写必填项，并确认次数、可购次数和排序编号不小于 1');return}const old=editingId&&cards.find(x=>x.id===editingId);const d={name,times,days,price:Number(price),limit,sort,stores:old?old.stores:'全部门店',online:online.value,onlineBooking:onlineBooking.value};if(editingId){Object.assign(old,d)}else{cards.unshift({id:Date.now(),...d,status:'上架'})}closeModal();render();showToast('体验卡已保存')}
    $('#overlay').addEventListener('click',e=>{if(e.target===$('#overlay'))closeModal()});render();
  </script>
</body>
</html>
