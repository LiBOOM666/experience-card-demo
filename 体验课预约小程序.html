<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>培训班体验次卡</title>
  <style>
    :root{--mint:#19c98b;--ink:#1e2329;--sub:#8b9199;--line:#edf0f2;--bg:#f5f7f8;--gold:#cbb200}*{box-sizing:border-box}body{margin:0;background:#e9edf0;font-family:"PingFang SC","Microsoft YaHei",sans-serif;color:var(--ink)}button{font:inherit;cursor:pointer}.phone{width:390px;height:844px;margin:20px auto;background:#fff;overflow:hidden;position:relative;box-shadow:0 14px 40px #24304430}.page{height:100%;display:none;background:#fff}.page.active{display:block}.nav{height:88px;padding:38px 18px 0;display:flex;align-items:center;justify-content:space-between;background:#fff}.nav h1{font-size:19px;margin:0;font-weight:700}.back,.nav-side{width:42px;border:0;background:transparent;padding:0;color:#20252a;font-size:33px;line-height:1;text-align:left}.nav-side{text-align:right;font-size:22px;letter-spacing:-4px}.scroll{height:calc(100% - 88px);overflow:auto;padding-bottom:86px}.detail-card{height:196px;margin:14px 16px 18px;border-radius:14px;padding:23px 20px;color:#fff;overflow:hidden;position:relative;background:linear-gradient(126deg,#183d39,#315e56 50%,#8fbead)}.detail-card:after{content:"";position:absolute;width:208px;height:208px;right:-45px;top:-73px;border-radius:50%;background:#d4f0e6aa}.detail-card>*{position:relative;z-index:1}.state{position:absolute;right:0;top:22px;background:#173d37;padding:7px 13px;border-radius:18px 0 0 18px;font-size:13px}.card-name{font-size:26px;font-weight:700;margin:30px 0 10px}.card-meta{font-size:15px;line-height:1.9}.card-meta b{font-size:19px}.info-grid{height:103px;margin:0 16px;display:grid;grid-template-columns:1fr 1fr;border-bottom:1px solid var(--line)}.info-item{display:grid;grid-template-columns:34px minmax(0,1fr) 15px;align-items:center;gap:6px;border:0;background:#fff;text-align:left;padding:0 5px;color:var(--ink)}.info-item+.info-item{border-left:1px solid var(--line);padding-left:16px}.info-item .icon{font-size:23px}.info-item strong{display:block;font-size:16px;white-space:nowrap}.info-item small{display:block;color:var(--sub);font-size:13px;margin-top:6px;white-space:nowrap}.info-item .arrow{font-size:24px;color:#9aa1a7}.notice{margin:23px 16px 0;border-radius:12px;background:#f7fbf9;padding:17px 16px}.notice h2{font-size:17px;margin:0 0 10px}.notice p{font-size:14px;line-height:1.8;color:#4b535a;margin:0;white-space:pre-line}.fixed-action{position:absolute;z-index:4;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #f0f0f0;height:76px;padding:14px 46px}.primary{width:100%;height:48px;border:0;border-radius:24px;color:#fff;background:var(--mint);font-weight:700;font-size:17px}.date-bar{display:flex;gap:5px;padding:8px 12px 15px;overflow-x:auto;border-bottom:1px solid var(--line)}.date{min-width:58px;text-align:center;border:0;color:#737b84;background:#fff;padding:8px 2px;border-radius:10px}.date b{display:block;font-size:15px;margin-bottom:4px}.date span{font-size:12px}.date.active{color:#fff;background:var(--mint)}.course-list{background:var(--bg);padding:13px 16px;min-height:610px}.course-card{width:100%;padding:16px;background:#fff;border:0;border-radius:12px;text-align:left;margin-bottom:12px;box-shadow:0 1px 3px #2932410d}.course-top{display:flex;justify-content:space-between;gap:8px}.course-name{font-size:17px;font-weight:700}.quota{font-size:13px;color:#5e6872;background:#f3f6f5;border-radius:12px;padding:4px 8px;white-space:nowrap}.course-row{display:flex;align-items:center;gap:8px;color:#6c747c;font-size:14px;margin-top:12px}.course-row i{font-style:normal;color:#9ea6ad;width:16px}.course-coach{margin:13px -16px -16px;padding:11px 16px;border-top:1px solid var(--line);color:#5d666e;font-size:14px}.hint{font-size:13px;color:#969da4;padding:3px 2px 12px}.booking-hero{padding:20px 20px 22px}.booking-hero h2{font-size:24px;margin:0 0 16px}.booking-hero p{color:#7d858d;font-size:15px;margin:0 0 12px}.booking-hero p:last-child{margin-bottom:0}.section{border-top:10px solid var(--bg);padding:0 16px}.field{min-height:68px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;font-size:17px}.field .value{color:var(--gold);font-size:15px}.field .minor{color:#a0a6ac;font-size:14px}.people{gap:12px}.stepper{display:flex;align-items:center;gap:18px}.stepper button{border:0;border-radius:50%;background:#f1f3f4;color:#c8cdd1;width:30px;height:30px;font-size:23px;line-height:1}.stepper strong{font-weight:400}.notes{height:96px;display:block;padding-top:19px}.notes span{display:block;color:#a0a6ac;font-size:14px;margin-top:12px}.notice-title{height:70px;font-size:17px}.course-intro{padding:19px 0 25px;font-size:14px;line-height:1.8;color:#4f565c}.toast{position:absolute;z-index:9;left:50%;top:50%;transform:translate(-50%,-50%);background:#222c34e8;color:#fff;border-radius:9px;padding:15px 20px;white-space:nowrap;display:none}.toast.show{display:block}@media(max-width:500px){.phone{width:100%;height:100vh;margin:0;box-shadow:none}}
  </style>
  <style>
    .card-stats{margin:22px 16px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}.card-stat{height:56px;display:flex;align-items:center;justify-content:space-between;font-size:16px}.card-stat+.card-stat{border-top:1px solid var(--line)}.card-stat span{color:var(--ink)}.card-stat strong{font-size:15px;color:var(--sub);font-weight:400}
  </style>
  <style>
    .course-card.full{background:#f1f3f4;color:#a2a9af;box-shadow:none;cursor:not-allowed}.course-card.full .quota{background:#e5e8ea;color:#8e969d}.course-card.full .course-row,.course-card.full .course-coach{color:#a2a9af}.course-card.full .course-coach{border-color:#e1e4e6}.booking-course{padding:22px 20px 16px}.booking-course h2{font-size:23px;margin:0 0 20px}.course-detail{display:grid;grid-template-columns:82px minmax(0,1fr);gap:16px 10px;font-size:15px;line-height:1.35}.course-detail dt{color:#8b9199}.course-detail dd{margin:0;color:#303840;text-align:right}.right-value{border:0;background:#fff;color:var(--ink);padding:0;display:flex;align-items:center;gap:7px;font-size:15px}.right-value b{font-weight:500}.right-value span{color:#9aa1a7;font-size:22px}.drawer-mask{position:absolute;inset:0;z-index:11;background:#17223866;display:none}.drawer-mask.show{display:block}.right-drawer{position:absolute;z-index:12;left:0;right:0;bottom:0;background:#fff;border-radius:18px 18px 0 0;transform:translateY(105%);transition:transform .24s ease}.right-drawer.show{transform:translateY(0)}.drawer-title{padding:20px 20px 12px;font-size:18px;font-weight:700}.right-option{width:100%;border:0;border-top:1px solid var(--line);background:#fff;padding:16px 20px;text-align:left;display:flex;align-items:center;justify-content:space-between}.right-option strong{display:block;font-size:16px}.right-option small{display:block;color:var(--sub);font-size:13px;margin-top:6px}.right-option i{color:var(--mint);font-style:normal;font-size:19px}.drawer-cancel{height:54px;width:100%;border:0;border-top:8px solid var(--bg);background:#fff;color:#59636e;font-size:16px}.success-mask{position:absolute;inset:0;z-index:15;background:#fff;display:none;align-items:center;justify-content:center}.success-mask.show{display:flex}.success-content{text-align:center;transform:translateY(-28px)}.success-icon{width:66px;height:66px;margin:0 auto 18px;border-radius:50%;display:grid;place-items:center;background:#e8faf3;color:var(--mint);font-size:35px}.success-content h2{margin:0 0 9px;font-size:22px}.success-content p{margin:0;color:var(--sub);font-size:14px}.booking-tabs{height:58px;display:flex;align-items:flex-end;gap:28px;padding:0 18px;border-bottom:1px solid var(--line)}.booking-tab{height:58px;border:0;background:#fff;color:#8d949b;font-size:17px;padding:0}.booking-tab.active{color:var(--ink);font-weight:700;border-bottom:3px solid var(--ink)}.status-tabs{display:flex;gap:9px;overflow:auto;padding:14px 12px;background:#f7f8f9}.status-tab{min-width:78px;height:36px;border:1px solid #e2e5e8;border-radius:8px;background:#fff;color:#8b9199;font-size:15px}.status-tab.active{border-color:#cbb200;background:#cbb200;color:#fff}.reservation-list{background:#f5f6f7;min-height:640px;padding:12px 0}.reservation-card{background:#fff;padding:21px 20px 18px}.reservation-time{display:flex;align-items:center;justify-content:space-between;color:#353c43;font-size:16px}.reservation-time b{font-weight:400}.reservation-time .clock{color:#68737c;margin-right:8px}.reservation-state{color:#cbb200;font-size:14px}.reservation-card h2{font-size:19px;margin:22px 0 17px}.reservation-meta{display:grid;gap:10px;color:#9aa1a7;font-size:15px}.reservation-actions{display:flex;align-items:center;justify-content:space-between;margin-top:27px}.more{border:0;background:#fff;padding:0;color:#303840;font-size:16px}.outline-btn{min-width:104px;height:42px;border:1px solid #dfe3e6;border-radius:8px;background:#fff;font-size:16px;color:#303840}
  </style>
</head>
<body>
  <main class="phone">
    <section id="detail" class="page active">
      <header class="nav"><button class="back" aria-label="返回">‹</button><h1>培训班体验次卡</h1><span class="nav-side"></span></header>
      <div class="scroll">
        <div class="detail-card"><div class="card-name">少儿游泳体验课</div></div>
        <div class="info-grid"><button class="info-item"><span class="icon">⌂</span><span><strong>适用场馆</strong><small>1 家</small></span><span class="arrow">›</span></button><button class="info-item"><span class="icon">▤</span><span><strong>可用课程</strong><small>1 种</small></span><span class="arrow">›</span></button></div>
        <div class="card-stats"><div class="card-stat"><span>剩余次数</span><strong>1 次</strong></div><div class="card-stat"><span>有效期</span><strong>剩余 28 天</strong></div></div>
        <section class="notice"><h2>使用须知</h2><p>请提前预约体验课程。
体验权益仅限本人使用，逾期自动失效。
如需取消，请在开课前 2 小时操作。</p></section>
      </div>
      <footer class="fixed-action"><button class="primary" onclick="showPage('list')">我要约课</button></footer>
    </section>

    <section id="list" class="page">
      <header class="nav"><button class="back" onclick="showPage('detail')" aria-label="返回">‹</button><h1>选择课程</h1><span class="nav-side"></span></header>
      <div class="scroll"><div class="date-bar" id="dates"></div><div class="course-list"><div class="hint" id="dateTitle">9 月 7 日（今天）可预约课程</div><div id="courseCards"></div></div></div>
    </section>

    <section id="booking" class="page">
      <header class="nav"><button class="back" onclick="showPage('list')" aria-label="返回">‹</button><h1>课次预约</h1><span class="nav-side"></span></header>
      <div class="scroll"><section class="booking-course"><h2 id="bookingName">少儿游泳体验课</h2><dl class="course-detail"><dt>上课日期</dt><dd id="bookingDate">2026-09-07（今天）</dd><dt>上课时间</dt><dd id="bookingTime">19:00–19:45</dd><dt>上课场馆</dt><dd id="bookingVenue">钱江游泳馆</dd><dt>上课场地</dt><dd id="bookingPlace">泳道 2</dd><dt>教练信息</dt><dd id="bookingCoach">王教练</dd></dl></section><section class="section"><div class="field"><span>体验权益</span><button class="right-value" onclick="openRightDrawer()"><b id="rightName">少儿游泳体验次卡</b><span>›</span></button></div></section></div>
      <footer class="fixed-action"><button class="primary" onclick="confirmBooking()">确认预约</button></footer>
    </section>
    <section id="myBooking" class="page">
      <header class="nav"><button class="back" onclick="showPage('detail')" aria-label="返回">‹</button><h1>我的预约</h1><span class="nav-side">•••</span></header>
      <div class="booking-tabs"><button class="booking-tab active">培训班</button></div>
      <div class="scroll"><div class="status-tabs"><button class="status-tab">全部</button><button class="status-tab active">待上课</button><button class="status-tab">已请假</button><button class="status-tab">已完成</button></div><div class="reservation-list" id="reservationList"></div></div>
    </section>
    <div id="toast" class="toast">预约成功</div>
    <div id="drawerMask" class="drawer-mask" onclick="closeRightDrawer()"></div><section id="rightDrawer" class="right-drawer"><div class="drawer-title">选择体验权益</div><div id="rightOptions"></div><button class="drawer-cancel" onclick="closeRightDrawer()">取消</button></section>
    <div id="successMask" class="success-mask"><div class="success-content"><div class="success-icon">✓</div><h2>预约成功</h2><p>已为你保留课次，即将前往我的预约</p></div></div>
  </main>
  <script>
    const schedules=[
      {day:'今天',date:'09/07',title:'9 月 7 日（今天）',courses:[['少儿游泳体验课','19:00–19:45','3 / 6 人','王教练'],['少儿游泳体验课','20:00–20:45','6 / 6 人','李教练']]},
      {day:'周二',date:'09/08',title:'9 月 8 日（周二）',courses:[['少儿游泳体验课','18:30–19:15','2 / 6 人','王教练']]},
      {day:'周三',date:'09/09',title:'9 月 9 日（周三）',courses:[['少儿游泳体验课','19:00–19:45','5 / 6 人','赵教练']]},
      {day:'周四',date:'09/10',title:'9 月 10 日（周四）',courses:[]},
      {day:'周五',date:'09/11',title:'9 月 11 日（周五）',courses:[['少儿游泳体验课','19:00–19:45','1 / 6 人','王教练']]}
    ];const rights=[{id:1,name:'少儿游泳体验次卡',meta:'剩余 1 次｜有效期至 2026-10-05'},{id:2,name:'暑期游泳体验次卡',meta:'剩余 2 次｜有效期至 2026-09-30'}];let current=0, selected=null, selectedRight=rights[0], myReservation=null;
    function showPage(id){document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));document.getElementById(id).classList.add('active')}
    function renderDates(){document.getElementById('dates').innerHTML=schedules.map((d,i)=>`<button class="date ${i===current?'active':''}" onclick="selectDate(${i})"><b>${d.day}</b><span>${d.date}</span></button>`).join('')}
    function selectDate(i){current=i;renderDates();const d=schedules[i];document.getElementById('dateTitle').textContent=d.title+'可预约课程';document.getElementById('courseCards').innerHTML=d.courses.length?d.courses.map((c,n)=>{const [booked,total]=c[2].split('/').map(v=>parseInt(v,10)),full=booked>=total;return `<button class="course-card ${full?'full':''}" data-full="${full}" onclick="handleCourseClick(this,${n})"><div class="course-top"><span class="course-name">${c[0]}</span><span class="quota">预约人数：${c[2]}</span></div><div class="course-row"><i>◷</i>上课时间：${c[1]}</div><div class="course-coach">教练：${c[3]} <span class="arrow" style="float:right">›</span></div></button>`}).join(''):'<p class="hint">当天暂无可预约课程，请切换其他日期。</p>'}
    function openBooking(n){selected=schedules[current].courses[n];const date=`2026-${schedules[current].date.replace('/','-')}`;document.getElementById('bookingName').textContent=selected[0];document.getElementById('bookingDate').textContent=`${date}（${schedules[current].day}）`;document.getElementById('bookingTime').textContent=selected[1];document.getElementById('bookingVenue').textContent='钱江游泳馆';document.getElementById('bookingPlace').textContent='泳道 2';document.getElementById('bookingCoach').textContent=selected[3];renderRight();showPage('booking')}
    function flashToast(message){const t=document.getElementById('toast');t.textContent=message;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1600)}
    function showFullCourse(){flashToast('该课次已满员')}
    function handleCourseClick(card,n){if(card.dataset.full==='true'){showFullCourse();return}openBooking(n)}
    function renderRight(){document.getElementById('rightName').textContent=selectedRight.name;document.getElementById('rightOptions').innerHTML=rights.map(right=>`<button class="right-option" onclick="selectRight(${right.id})"><span><strong>${right.name}</strong><small>${right.meta}</small></span><i>${right.id===selectedRight.id?'✓':''}</i></button>`).join('')}
    function openRightDrawer(){document.getElementById('drawerMask').classList.add('show');document.getElementById('rightDrawer').classList.add('show')}
    function closeRightDrawer(){document.getElementById('drawerMask').classList.remove('show');document.getElementById('rightDrawer').classList.remove('show')}
    function selectRight(id){selectedRight=rights.find(right=>right.id===id);renderRight();closeRightDrawer()}
    function renderMyBooking(){if(!myReservation)return;document.getElementById('reservationList').innerHTML=`<article class="reservation-card"><div class="reservation-time"><b><span class="clock">◷</span>${myReservation.date} ${myReservation.time}</b><span class="reservation-state">待上课</span></div><h2>${myReservation.name}</h2><div class="reservation-meta"><span>门店：${myReservation.venue}</span><span>班级：体验课</span><span>地点：${myReservation.place}</span><span>教练：${myReservation.coach}</span><span>扣卡：${myReservation.right}</span></div><div class="reservation-actions"><button class="more">更多</button><button class="outline-btn">详情</button></div></article>`}
    function confirmBooking(){if(!selected)return;const [booked,total]=selected[2].split('/').map(value=>parseInt(value,10));if(booked>=total){flashToast('该课次已满员');showPage('list');return}selected[2]=`${booked+1} / ${total} 人`;myReservation={name:selected[0],date:`2026-${schedules[current].date.replace('/','-')}（${schedules[current].day}）`,time:selected[1],venue:'钱江游泳馆',place:'泳道 2',coach:selected[3],right:selectedRight.name};document.getElementById('successMask').classList.add('show');setTimeout(()=>{document.getElementById('successMask').classList.remove('show');renderMyBooking();showPage('myBooking')},1300)}renderDates();selectDate(0);renderRight();
  </script>
</body>
</html>
