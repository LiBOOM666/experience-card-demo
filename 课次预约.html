<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>课表管理</title>
  <style>
    :root{--main:#31c7b6;--deep:#14ae9d;--red:#f05b5b;--text:#27334a;--sub:#758195;--line:#e6ebf1;--bg:#f3f5f7}*{box-sizing:border-box}body{margin:0;min-width:1280px;color:var(--text);background:var(--bg);font:14px "PingFang SC","Microsoft YaHei",sans-serif}button,input,select{font:inherit}button{cursor:pointer}.top{height:68px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 26px}.top h1{font-size:18px;margin:0}.top-actions{display:flex;gap:16px}.btn{height:36px;border:1px solid var(--main);border-radius:19px;padding:0 20px;background:#fff;color:var(--deep)}.btn.primary{background:var(--main);color:#fff}.btn.gray{background:#bfc4ce;border-color:#bfc4ce;color:#fff}.schedule{padding:24px;width:48%;min-height:calc(100vh - 68px)}.filter{background:#fff;padding:22px;display:flex;gap:16px}.pill{height:38px;width:200px;border:1px solid #dce3e9;border-radius:20px;padding:0 16px;color:#697587;background:#fff}.schedule-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:2px;background:#e5ebef}.day{background:#fff;text-align:center;padding:16px;font-size:16px;font-weight:600}.course-block{height:148px;background:#ddf8f5;border-left:4px solid #55d7c8;padding:18px 16px;color:#3d4d5d;line-height:1.65}.course-block:nth-of-type(4n){background:#f8f9fa;border-left-color:#c3ccd4}.course-block strong{display:block;font-size:16px}.course-block small{display:block;color:#798697}.drawer{position:fixed;right:0;top:68px;bottom:0;width:61%;background:#fff;border-left:1px solid #dce2e8;box-shadow:-6px 0 18px rgba(44,61,78,.08);display:flex;flex-direction:column}.drawer-head{height:94px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 34px;flex:none}.drawer-head h2{margin:0;font-size:20px}.waiting{margin-left:10px;padding:4px 8px;color:#fff;background:#58d4c6;border-radius:4px;font-size:13px}.head-actions{display:flex;align-items:center;gap:17px}.text-btn{border:0;background:transparent;color:var(--deep);font-size:15px;padding:4px}.text-btn.red{color:var(--red)}.close{border:0;background:transparent;font-size:30px;line-height:1;color:#b5bdc5}.drawer-body{padding:26px 36px;overflow:auto}.detail{display:grid;grid-template-columns:132px 1fr;row-gap:22px;font-size:16px}.detail b{font-size:17px}.muted{color:#697587}.signin{color:var(--deep);margin-left:18px}.booking-title{display:flex;align-items:center;gap:22px;margin:46px 0 22px}.booking-title h3{margin:0;font-size:18px}.booking-title .count{font-size:16px;color:#536073}.booking-actions{margin-left:auto;display:flex;gap:10px}.searchbar{display:flex;gap:14px;margin-bottom:20px}.searchbar input{width:280px}.input{height:36px;border:1px solid #dbe2e9;border-radius:19px;padding:0 14px;outline:0}.input:focus{border-color:var(--main);box-shadow:0 0 0 3px rgba(49,199,182,.12)}table{border-collapse:collapse;width:100%}th,td{height:62px;border:1px solid var(--line);padding:0 16px;text-align:left}th{height:50px;background:#fbfcfd;color:#667486;font-weight:600}input[type=checkbox],input[type=radio]{accent-color:var(--main);width:17px;height:17px;vertical-align:-3px}.member-name{font-size:16px}.trial{display:inline-flex;width:21px;height:21px;margin-left:6px;border-radius:4px;align-items:center;justify-content:center;background:#ffad53;color:#fff;font-size:12px}.card-name{display:block;color:#4a5869;text-decoration:underline}.card-meta{display:block;margin-top:4px;color:#758195;font-size:13px}.unattended{color:var(--red)}.op{border:0;background:transparent;color:var(--deep);padding:0 7px}.add-list-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}.add-list-head h3{font-size:19px;margin:0}.candidate-list{height:calc(100vh - 305px);min-height:460px;overflow:auto;padding-right:8px}.candidate{min-height:88px;border:1px solid var(--line);border-radius:4px;margin-bottom:10px;padding:15px 18px;display:grid;grid-template-columns:34px 1fr 270px;align-items:center;gap:12px;cursor:pointer;background:#fff}.candidate.selected{border-color:#8ce2d7;background:#effcfb}.avatar{display:inline-flex;width:38px;height:38px;border-radius:50%;align-items:center;justify-content:center;background:#edf1f5;color:#6d7988;margin-right:10px}.candidate-main{display:flex;align-items:center}.candidate-main b{font-size:16px}.candidate-main small{display:block;color:var(--sub);margin-top:4px}.benefit{justify-self:end;width:260px;height:36px;border:1px solid #dce3e9;border-radius:4px;padding:0 10px;color:#536073;background:#fff}.list-foot{height:68px;border-top:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;margin:18px -36px -26px;padding:0 36px;position:sticky;bottom:-26px;background:#fff}.page-info{color:#697587}.modal-mask{position:fixed;inset:0;background:rgba(31,42,58,.36);display:none;align-items:center;justify-content:center;z-index:5}.modal-mask.show{display:flex}.modal{width:720px;background:#fff;box-shadow:0 10px 30px rgba(47,59,82,.16)}.modal-head{height:82px;border-bottom:1px solid var(--line);padding:0 28px;display:flex;justify-content:space-between;align-items:center}.modal-head h2{margin:0;font-size:21px}.modal-body{padding:26px 40px}.modal-foot{height:74px;border-top:1px solid var(--line);display:flex;align-items:center;justify-content:center;gap:16px}.form-row{display:grid;grid-template-columns:120px 1fr auto;gap:14px;align-items:center;margin-bottom:20px}.form-row label{text-align:right;font-weight:600;font-size:16px}.required:before{content:'*';color:var(--red);margin-right:4px}.form-row .input{border-radius:4px;width:100%;height:40px}.member-type{padding:4px 8px;background:#5d9df5;color:#fff;border-radius:3px}.contact-box{background:#f7f8fa;padding:18px 20px;margin:8px 0 18px}.contact-box h3{margin:0 0 18px;font-size:16px}.child-list{background:#f5f7f9;padding:12px 18px}.child{display:flex;align-items:center;gap:12px;padding:10px}.child-name{font-size:16px}.new-child{width:100%;height:40px;border:1px solid #dce3e9;background:#fff;padding:0 12px}.hint{color:#f2a100;margin:0 0 15px}.toast{display:none;position:fixed;z-index:9;top:84px;left:50%;transform:translateX(-50%);padding:10px 16px;background:rgba(31,42,58,.88);border-radius:4px;color:#fff}.toast.show{display:block}
    .add-list-head{gap:12px;flex-wrap:wrap}.add-list-head>.btn{flex:0 0 auto;min-width:88px;white-space:nowrap}.add-list-head .searchbar{flex:1;min-width:0;margin-bottom:0}.add-list-head .searchbar>.btn{flex:0 0 auto;min-width:88px;white-space:nowrap}.member-search{width:auto;min-width:0;height:38px;padding:3px;display:flex;flex:1;align-items:center;border:1px solid #dbe2e9;border-radius:20px;background:#fff}.member-modes{display:flex;align-items:center;gap:2px;flex:none}.member-mode{height:30px;padding:0 11px;border:0;border-radius:16px;background:#f1f3f5;color:#596677;font-size:13px;white-space:nowrap}.member-mode.active{background:var(--main);color:#fff}.member-search input{width:auto;min-width:0;height:30px;flex:1;border:0;box-shadow:none!important;padding:0 12px}.member-search input:focus{box-shadow:none}
    .student-gender{display:flex;gap:28px}.form-row .student-gender label{font-size:14px;font-weight:400;text-align:left}
    .child-modal{width:449px;border-radius:6px;overflow:hidden}.child-modal .modal-head{height:52px;padding:0 15px;position:relative;justify-content:center}.child-modal .modal-head h2{font-size:16px}.child-modal .close{position:absolute;right:13px;font-size:23px}.child-modal .modal-body{padding:20px 19px 35px 22px}.child-modal .form-row{grid-template-columns:83px minmax(0,1fr);gap:10px;margin-bottom:15px}.child-modal .form-row>label{font-size:14px;font-weight:400;white-space:nowrap}.child-modal .input{height:34px;border-radius:0;padding:0 12px}.child-modal .input:focus{box-shadow:none}.child-modal .form-row div>label{display:inline-block;text-align:left;font-size:14px;font-weight:400;margin-right:27px;color:#666}.child-modal input[type=radio]{width:16px;height:16px;margin:0 7px 0 0}.child-modal .child-row{align-items:start;margin-bottom:0}.child-modal .child-list{padding:12px 15px 16px;border-radius:4px}.child-modal .child{padding:0;gap:8px}.child-modal .child>input[type=radio]{flex:none;margin:0}.child-modal .new-child{height:34px;min-width:0;font-size:14px}.child-modal .child-gender{padding:17px 0 0 29px}.child-modal .modal-foot{height:73px;gap:9px}.child-modal .btn{height:34px;border-radius:3px;padding:0 13px}.child-modal .btn:not(.primary){border-color:#e5e5e5;color:#666}
  </style>
</head>
<body>
  <header class="top"><h1>课表管理</h1><div class="top-actions"><button class="btn primary">添加排课</button><button class="btn">批量操作</button><button class="btn">预约历史</button></div></header>
  <section class="schedule"><div class="filter"><button class="pill">全部课程</button><button class="pill">全部班级</button><button class="pill">全部教练</button></div><div class="schedule-grid"><div class="day">一 09/07</div><div class="day">二 09/08</div><div class="day">三 09/09</div><div class="course-block"><strong>10:00～10:40</strong><strong>少儿游泳体验课 (4/9)</strong><small>班级：海豚班<br>场地：泳道 2<br>教练：招恒-工</small></div><div class="course-block"><strong>10:00～11:00</strong><strong>游潜培训 (0/15)</strong><small>班级：1班<br>场地：泳道 1<br>教练：测试教练</small></div><div class="course-block"><strong>11:59～13:59</strong><strong>12月培训班 (2/21)</strong><small>班级：999999<br>场地：2222<br>教练：晓晓</small></div><div class="course-block"><strong>17:00～17:30</strong><strong>少儿游泳体验课 (4/9)</strong><small>班级：海豚班<br>场地：泳道 2<br>教练：招恒-工</small></div><div class="course-block"><strong>19:00～19:30</strong><strong>潜水培训课 (0/10)</strong><small>班级：--<br>场地：--<br>教练：--</small></div><div class="course-block"><strong>19:00～19:30</strong><strong>潜水培训课 (0/10)</strong><small>班级：--<br>场地：--<br>教练：--</small></div></div></section>
  <aside id="drawer" class="drawer"></aside><div id="mask" class="modal-mask"><div id="modal" class="modal"></div></div><div id="toast" class="toast"></div>
  <script>
    const $=s=>document.querySelector(s);let page=1;let selected=new Set();let candidateMode='本人';let bookings=[{id:1,name:'李小飞',phone:'15504953973',card:'培训班体验次卡·少儿游泳体验卡',meta:'扣卡权益 1 次｜剩余 2 次｜有效期至 2026-10-07',trial:true},{id:2,name:'周可可',phone:'138****2289',card:'培训班体验次卡·暑期体验卡',meta:'扣卡权益 1 次｜剩余 3 次｜有效期至 2026-09-30',trial:true},{id:3,name:'王晨',phone:'139****1028',card:'少儿游泳次卡',meta:'扣卡权益 1 次｜剩余 11 次｜有效期至 2026-12-30',trial:false},{id:4,name:'陈沫',phone:'136****8042',card:'培训班体验次卡·新生游泳体验卡',meta:'扣卡权益 1 次｜剩余 1 次｜有效期至 2026-09-16',trial:true}];
    const candidates=Array.from({length:16},(_,i)=>({id:i+1,name:['丁可','林一诺','陈雨桐','王小北','赵安安','周星晨','刘子墨','许乐乐','吴昊然','孙语嫣','高思远','罗依依','沈嘉禾','宋知夏','程子安','冯晓月'][i],phone:'1380000'+String(1000+i),remain:(i%3)+1,card:i%2?'少儿游泳体验卡':'新生游泳体验卡'}));
    function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),1700)}function closeModal(){$('#mask').classList.remove('show')}function openModal(title,body,foot){$('#modal').innerHTML=`<div class="modal-head"><h2>${title}</h2><button class="close" onclick="closeModal()">×</button></div><div class="modal-body">${body}</div><div class="modal-foot">${foot}</div>`;$('#mask').classList.add('show')}
    function showDetail(){selected.clear();$('#drawer').innerHTML=`<div class="drawer-head"><h2>课程预约详情 <span class="waiting">待上课</span></h2><div class="head-actions"><button class="text-btn">编辑课时</button><button class="text-btn red">取消排课</button><button class="text-btn">课程记录</button><button class="close">×</button></div></div><div class="drawer-body"><div class="detail"><b>班级名称</b><span class="muted">海豚班</span><b>课程名称</b><span class="muted">少儿游泳体验课</span><b>课程时间*</b><span class="muted">2026-09-12　10:00-10:40</span><b>上课教练</b><span class="muted">招恒-工 <button class="text-btn signin">签到</button></span><b>上课地点</b><span class="muted">泳道 2</span></div><div class="booking-title"><h3>预约列表</h3><span class="count">${bookings.length}/9</span><div class="booking-actions"><button class="btn" onclick="showAddList()">添加学员</button><button class="btn primary" onclick="showAddList()">添加体验学员</button></div></div><div class="searchbar"><input id="bookingSearch" class="input" placeholder="请输入会员姓名/手机号" oninput="renderBookings()"><button class="btn primary" onclick="renderBookings()">搜索</button></div><table><thead><tr><th></th><th>姓名</th><th>会员卡</th><th>状态</th><th>操作</th></tr></thead><tbody id="bookingRows"></tbody></table></div>`;renderBookings()}
    function renderBookings(){const k=$('#bookingSearch').value.trim();const rows=bookings.filter(x=>!k||x.name.includes(k)||x.phone.includes(k));$('#bookingRows').innerHTML=rows.map(x=>`<tr><td><input type="checkbox"></td><td><span class="member-name">${x.name}</span>${x.trial?'<span class="trial">试</span>':''}<span class="card-meta">${x.phone}</span></td><td><span class="card-name">${x.card}</span><span class="card-meta">${x.meta}</span></td><td><span class="unattended">未签到</span></td><td><button class="op" onclick="cancelBooking(${x.id})">取消预约</button>${x.trial?'':'<button class="op">请假</button>'}</td></tr>`).join('')}
    function cancelBooking(id){bookings=bookings.filter(x=>x.id!==id);showDetail();toast('已取消预约')}
    function showAddList(){page=1;selected.clear();renderAddList()}
    function renderAddList(){const key=($('#candidateSearch')||{}).value||'',placeholder={本人:'输入姓名/手机号/手机4位尾号',会员卡号:'输入会员卡号',联系人:'输入联系人姓名/手机号'}[candidateMode],visible=candidates.filter(x=>x.name.includes(key)||x.phone.includes(key));const list=visible.slice(0,page*10);$('#drawer').innerHTML=`<div class="drawer-head"><h2>添加体验学员</h2><div class="head-actions"><button class="close" onclick="showDetail()">×</button></div></div><div class="drawer-body"><div class="add-list-head"><div class="searchbar"><div class="member-search"><div class="member-modes">${['本人','会员卡号','联系人'].map(mode=>`<button class="member-mode ${candidateMode===mode?'active':''}" onclick="setCandidateMode('${mode}')">${mode}</button>`).join('')}</div><input id="candidateSearch" class="input" value="${key}" placeholder="${placeholder}" oninput="searchCandidates()" onkeydown="if(event.key==='Enter')searchCandidates()"></div><button class="btn primary" onclick="searchCandidates()">搜索</button></div><button class="btn" onclick="openIssueMember()">添加</button></div><div id="candidateList" class="candidate-list">${list.map(x=>candidateItem(x)).join('')}</div><div class="list-foot"><span class="page-info">已选择 <b id="selectedCount" style="color:var(--main)">0</b> 人</span><span><button class="btn primary" onclick="addSelected()">确定</button><button class="btn" onclick="showDetail()">取消</button></span></div></div>`;$('#candidateList').addEventListener('scroll',loadMoreByScroll);syncSelected()}
    function candidateItem(x){const checked=selected.has(x.id);return `<div class="candidate ${checked?'selected':''}" onclick="cardClick(event,${x.id})"><input type="checkbox" ${checked?'checked':''} onchange="toggleCandidate(${x.id})"><div class="candidate-main"><span class="avatar">${x.name.slice(0,1)}</span><div><b>${x.name}</b><small>${x.phone}　合同正常｜剩余 ${x.remain} 次</small></div></div><select class="benefit" ${checked?'':'disabled'} onclick="event.stopPropagation()"><option>培训班体验次卡·${x.card}</option><option>培训班体验次卡·暑期体验卡</option></select></div>`}
    function cardClick(e,id){if(e.target.tagName==='SELECT')return;toggleCandidate(id)}function toggleCandidate(id){selected.has(id)?selected.delete(id):selected.add(id);renderAddList()}function syncSelected(){const e=$('#selectedCount');if(e)e.textContent=selected.size}function setCandidateMode(mode){candidateMode=mode;page=1;renderAddList()}function searchCandidates(){page=1;renderAddList()}function loadMoreByScroll(e){const el=e.target;if(el.scrollTop+el.clientHeight<el.scrollHeight-4)return;const key=$('#candidateSearch').value||'',visible=candidates.filter(x=>x.name.includes(key)||x.phone.includes(key));if(page*10>=visible.length)return;const more=visible.slice(page*10,(page+1)*10);page++;el.insertAdjacentHTML('beforeend',more.map(x=>candidateItem(x)).join(''))}
    function addSelected(){if(!selected.size){toast('请至少选择一位体验学员');return}if(bookings.length+selected.size>9){toast('课次人数已满，无法加入体验学员');return}const toAdd=candidates.filter(x=>selected.has(x.id));bookings.push(...toAdd.map(x=>({id:Date.now()+x.id,name:x.name,phone:x.phone,card:'培训班体验次卡·'+x.card,meta:'扣卡权益 1 次｜剩余 '+x.remain+' 次｜有效期至 2026-10-07',trial:true})));showDetail();toast(`已加入 ${toAdd.length} 位体验学员`)}
    let issueDraft=null;
    const safe=value=>String(value||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    function openIssueMember(restore=false){
      if(!restore)issueDraft={mobile:'',name:'',gender:'',birthday:'',benefit:'培训班体验次卡·少儿游泳体验卡',contact:null};
      const d=issueDraft,c=d.contact;
      $('#modal').classList.remove('child-modal');
      openModal('添加体验学员',`<div class="form-row"><label class="required">手机号</label><input id="mobile" class="input" value="${safe(d.mobile)}" placeholder="输入手机号或姓名查询"><button class="btn" onclick="openChildMember()">少儿会员</button></div><div class="form-row"><label class="required" for="newName">姓名</label><input id="newName" class="input" required value="${safe(d.name)}" placeholder="手机号检索到用户后自动回填"></div><div class="form-row"><label>性别</label><div class="student-gender"><label><input type="radio" name="studentGender" value="男" ${d.gender==='男'?'checked':''}> 男</label><label><input type="radio" name="studentGender" value="女" ${d.gender==='女'?'checked':''}> 女</label></div></div><div class="form-row"><label for="studentBirthday">生日</label><input id="studentBirthday" class="input" type="date" value="${safe(d.birthday)}"></div>${c?`<div class="contact-box"><h3>联系人</h3><div class="form-row"><label class="required">关系</label><select id="contactRelation" class="input"><option>家长</option><option>本人</option></select></div><div class="form-row"><label class="required">联系人姓名</label><input id="contactName" class="input" value="${safe(c.name)}"></div><div class="form-row"><label>性别</label><div class="student-gender"><label><input type="radio" name="contactGender" value="男" ${c.gender==='男'?'checked':''}> 男</label><label><input type="radio" name="contactGender" value="女" ${c.gender==='女'?'checked':''}> 女</label></div></div><div class="form-row"><label class="required">联系人手机号</label><input id="contactPhone" class="input" value="${safe(c.phone)}"></div></div>`:''}<div class="form-row"><label class="required">体验权益</label><select id="issueBenefit" class="input"><option>培训班体验次卡·少儿游泳体验卡</option><option>培训班体验次卡·暑期体验卡</option></select></div>`,`<button class="btn" onclick="closeModal()">取消</button><button class="btn primary" onclick="issueAndAdd()">确认添加</button>`);
      $('#issueBenefit').value=d.benefit;if(c)$('#contactRelation').value=c.relation;
    }
    function openChildMember(){
      issueDraft.mobile=$('#mobile').value;issueDraft.name=$('#newName').value;issueDraft.benefit=$('#issueBenefit').value;issueDraft.gender=$('input[name="studentGender"]:checked')?.value||'';issueDraft.birthday=$('#studentBirthday').value;
      if(issueDraft.contact)Object.assign(issueDraft.contact,{name:$('#contactName').value,gender:$('input[name="contactGender"]:checked')?.value||'',phone:$('#contactPhone').value,relation:$('#contactRelation').value});
      const c=issueDraft.contact||{};
      openModal('少儿会员',`<div class="form-row"><label class="required">家长手机号:</label><input id="parentPhone" class="input" placeholder="请输入家长手机号" value="${safe(c.phone)}"></div><div class="form-row"><label class="required">家长姓名:</label><input id="parentName" class="input" placeholder="请输入家长姓名" value="${safe(c.name)}"></div><div class="form-row"><label class="required">家长性别:</label><div><label><input type="radio" name="parentGender" value="男" ${c.gender!=='女'?'checked':''}> 男</label><label><input type="radio" name="parentGender" value="女" ${c.gender==='女'?'checked':''}> 女</label></div></div><div class="form-row child-row"><label>孩子信息:</label><div class="child-list"><div class="child"><input type="radio" checked name="childChoice" aria-label="选择孩子"><input id="childName" class="new-child" placeholder="输入孩子姓名" value="${safe(c.phone?issueDraft.name:'')}"></div><div class="child-gender"><label><input type="radio" name="childGender" value="男" ${c.childGender!=='女'?'checked':''}> 男</label><label><input type="radio" name="childGender" value="女" ${c.childGender==='女'?'checked':''}> 女</label></div></div></div>`,`<button class="btn" onclick="openIssueMember(true)">取消</button><button class="btn primary" onclick="selectChild()">保存</button>`);
      $('#modal').classList.add('child-modal');$('#modal .close').onclick=()=>openIssueMember(true);$('#parentPhone').focus();
    }
    function selectChild(){
      const phone=$('#parentPhone').value.trim(),name=$('#parentName').value.trim(),childName=$('#childName').value.trim();
      if(!/^1\d{10}$/.test(phone)){toast('请输入正确的家长手机号');return}
      if(!name){toast('请输入家长姓名');return}if(!childName){toast('请输入孩子姓名');return}
      issueDraft.mobile=issueDraft.contact&&/^T\d+$/.test(issueDraft.mobile)?issueDraft.mobile:'T'+String(Math.floor(Math.random()*10000000000)).padStart(10,'0');issueDraft.name=childName;
      issueDraft.contact={phone,name,relation:'家长',gender:$('input[name="parentGender"]:checked').value,childGender:$('input[name="childGender"]:checked').value};
      issueDraft.gender=issueDraft.contact.childGender;
      openIssueMember(true);
    }
    function issueAndAdd(){
      const name=$('#newName').value.trim(),phone=$('#mobile').value.trim(),card=$('#issueBenefit').value;
      if(!phone){toast('请输入手机号');return}if(!name){toast('请输入学员姓名');return}
      if(issueDraft.contact&&(!$('#contactName').value.trim()||!/^1\d{10}$/.test($('#contactPhone').value.trim()))){toast('请填写完整、正确的联系人信息');return}
      if(bookings.length>=9){toast('课次人数已满，无法加入体验学员');return}
      const contact=issueDraft.contact?{...issueDraft.contact,name:$('#contactName').value.trim(),gender:$('input[name="contactGender"]:checked')?.value||'',phone:$('#contactPhone').value.trim(),relation:$('#contactRelation').value}:null;
      bookings.push({id:Date.now(),name,phone,gender:$('input[name="studentGender"]:checked')?.value||'',birthday:$('#studentBirthday').value,contact,card,meta:'扣卡权益 1 次｜剩余 1 次｜有效期至 2026-10-07',trial:true});closeModal();showDetail();toast('已发放体验权益并加入课次');
    }
    showDetail();
  </script>
</body>
</html>
