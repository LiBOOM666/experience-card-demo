<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0" />
  <title>体验权益发放记录</title>
  <style>
    :root{--main:#29c7b1;--deep:#18a996;--text:#2f3b52;--sub:#758195;--line:#e7edf3;--bg:#f1f4f7}*{box-sizing:border-box}body{margin:0;min-width:1240px;background:var(--bg);color:var(--text);font:14px "PingFang SC","Microsoft YaHei",sans-serif}button,input,select{font:inherit}button{cursor:pointer}.topbar{height:68px;padding:0 24px;display:flex;align-items:center;justify-content:space-between;background:#fff;border-bottom:1px solid var(--line)}h1{font-size:18px;margin:0}.operator{font-size:13px;color:var(--sub)}.main{padding:16px}.toolbar{height:62px;padding:0 16px;display:flex;align-items:end;background:#fff}.tab{height:62px;padding:0 8px;display:flex;align-items:center;color:var(--deep);font-weight:700;border-bottom:2px solid var(--main)}.panel{margin-top:14px;background:#fff;border:1px solid var(--line)}.filters{min-height:120px;padding:24px 16px 14px;display:flex;align-items:flex-start;gap:18px;border-bottom:1px solid var(--line)}label{white-space:nowrap;color:#526075}.field{height:34px;min-width:138px;padding:0 13px;color:var(--text);border:1px solid #dbe2ea;border-radius:17px;background:#fff;outline:0}.field:focus{border-color:var(--main);box-shadow:0 0 0 3px #29c7b120}.search{width:238px}.date{width:198px}.btn{height:34px;padding:0 18px;border:1px solid var(--main);border-radius:17px;background:#fff;color:var(--deep)}.btn.primary{color:#fff;background:var(--main)}.reset{padding:7px;border:0;background:transparent;color:var(--sub)}.table-wrap{overflow-x:auto}table{width:100%;min-width:1220px;border-collapse:collapse}th,td{height:50px;padding:0 16px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}th{background:#fbfcfe;font-weight:700}th:last-child,td:last-child{border-right:0}.link{border:0;background:transparent;padding:0;color:var(--deep);font-size:13px}.pagination{height:58px;padding:0 16px;display:flex;justify-content:flex-end;align-items:center;gap:12px;color:var(--sub);font-size:13px}.page{width:28px;height:28px;border:1px solid var(--main);background:#fff;color:var(--deep)}
    /* 内容区会随侧边导航缩窄，检索条件自动换行，表格独立横向滚动。 */
    body{min-width:0}.main,.panel{min-width:0}.filters{flex-wrap:wrap;align-items:center;gap:12px 18px}.table-wrap{width:100%}
  </style>
</head>
<body>
  <header class="topbar"><h1>体验权益发放记录</h1><span class="operator">运营管理</span></header>
  <main class="main"><section class="toolbar"><span class="tab">发放记录</span></section><section class="panel"><div class="filters"><label>门店 <select id="store" class="field" onchange="render()"><option value="">全部</option><option>钱江游泳馆</option><option>滨江游泳馆</option><option>西溪游泳馆</option></select></label><label>用户 <input id="user" class="field search" placeholder="请输入姓名或手机号" oninput="render()" /></label><label>体验卡 <input id="card" class="field" list="cardOptions" placeholder="请输入或选择体验卡" oninput="render()" /></label><label>领取方式 <select id="method" class="field" onchange="render()"><option value="">全部</option><option>前台发卡</option><option>在线购买</option></select></label><label>操作人 <input id="operator" class="field" placeholder="请输入操作人" oninput="render()" /></label><label>操作时间 <input id="time" type="date" class="field date" onchange="render()" /></label><button class="btn primary" onclick="render()">查询</button><button class="reset" onclick="resetFilters()">重置</button></div><datalist id="cardOptions"><option value="少儿游泳体验课"></option><option value="暑期游泳体验课"></option><option value="自由泳体验课"></option></datalist><div class="table-wrap"><table><thead><tr><th>门店</th><th>用户</th><th>体验卡</th><th>领取方式</th><th>操作人</th><th>操作时间</th><th>操作</th></tr></thead><tbody id="rows"></tbody></table></div><div class="pagination"><span id="total"></span><span>10 条/页</span><button class="page">1</button></div></section></main>
  <script>
    const data=[
      ['钱江游泳馆','陈梓涵  138****1208','少儿游泳体验课','前台发卡','张佳','2026-09-07 10:24'],['滨江游泳馆','李沐阳  139****3812','暑期游泳体验课','在线购买','系统','2026-09-07 09:42'],['钱江游泳馆','王子轩  136****9980','少儿游泳体验课','前台发卡','王琳','2026-09-06 18:36'],['西溪游泳馆','刘诗涵  137****2654','自由泳体验课','在线购买','系统','2026-09-06 14:18'],['滨江游泳馆','赵奕辰  135****6721','少儿游泳体验课','前台发卡','周敏','2026-09-05 16:05'],['钱江游泳馆','孙雨桐  188****4031','暑期游泳体验课','在线购买','系统','2026-09-05 11:39'],['西溪游泳馆','周子墨  186****7536','少儿游泳体验课','前台发卡','李静','2026-09-04 17:22'],['滨江游泳馆','吴悠然  133****1620','自由泳体验课','在线购买','系统','2026-09-04 12:46'],['钱江游泳馆','郑思远  189****9823','少儿游泳体验课','前台发卡','张佳','2026-09-03 15:17'],['西溪游泳馆','冯可心  158****0927','暑期游泳体验课','前台发卡','王琳','2026-09-03 10:08']
    ]; const $=id=>document.getElementById(id);
    function render(){const s=$('store').value,u=$('user').value.trim(),c=$('card').value.trim(),m=$('method').value,o=$('operator').value.trim(),t=$('time').value;const rows=data.filter(x=>(!s||x[0]===s)&&(!u||x[1].includes(u))&&(!c||x[2].includes(c))&&(!m||x[3]===m)&&(!o||x[4].includes(o))&&(!t||x[5].startsWith(t)));$('rows').innerHTML=rows.map(x=>`<tr>${x.slice(0,6).map(v=>`<td>${v}</td>`).join('')}<td><button class="link" onclick="openUsage('${x[1]}','${x[2]}')">使用记录</button></td></tr>`).join('')||'<tr><td colspan="7" style="text-align:center;color:#758195">暂无符合条件的记录</td></tr>';$('total').textContent=`共 ${rows.length} 条`}
    function openUsage(user,card){location.href='体验权益使用记录.html?user='+encodeURIComponent(user)+'&card='+encodeURIComponent(card)}
    function resetFilters(){['store','user','card','method','operator','time'].forEach(id=>$(id).value='');render()}render();
  </script>
</body>
</html>
